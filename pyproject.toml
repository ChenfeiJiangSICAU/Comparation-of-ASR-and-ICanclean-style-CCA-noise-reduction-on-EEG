[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grf-eeg-denoise"
version = "0.1.0"
description = "ASR and iCanClean-style denoising benchmark for MobileBCI EEG/IMU data."
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "scikit-learn>=1.5",
]

[tool.setuptools.packages.find]
where = ["src"]
